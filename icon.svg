<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Vivado native plugin">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2b4b"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="nwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#nbg)" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.5"/>
  <!-- chip -->
  <rect x="28" y="28" width="40" height="40" rx="6" fill="#0d2540" stroke="#93c5fd" stroke-width="2"/>
  <!-- pins -->
  <g stroke="#93c5fd" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <path d="M36 28V19"/><path d="M48 28V19"/><path d="M60 28V19"/>
    <path d="M36 68V77"/><path d="M48 68V77"/><path d="M60 68V77"/>
    <path d="M28 36H19"/><path d="M28 48H19"/><path d="M28 60H19"/>
    <path d="M68 36H77"/><path d="M68 48H77"/><path d="M68 60H77"/>
  </g>
  <!-- native "N" of node powering a UART waveform -->
  <path d="M34 60V38l28 22V38" fill="none" stroke="url(#nwave)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- status dot -->
  <circle cx="79" cy="17" r="4.6" fill="#4ade80"/>
</svg>
